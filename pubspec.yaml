name: beres
description: "Beres? — planner menu mingguan, daftar belanja eceran/grosir, dan checklist dapur."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.6.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  sqflite: ^2.3.3
  path: ^1.9.0
  provider: ^6.1.2
  intl: ">=0.19.0 <0.21.0"
  share_plus: ^10.1.4
  google_fonts: ^6.2.1
  home_widget: ^0.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  sqflite_common_ffi: ^2.3.3
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true

# Ikon aplikasi dibangkitkan dari assets/icon/, yang sendirinya di-render dari
# maskot Si Beres lewat `flutter test tool/make_icon.dart`.
flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  image_path: "assets/icon/beres_icon.png"
  adaptive_icon_background: "#1F4D36"
  adaptive_icon_foreground: "assets/icon/beres_icon_fg.png"
  remove_alpha_ios: true
  min_sdk_android: 21
